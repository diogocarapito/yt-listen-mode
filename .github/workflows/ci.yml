# Quick sanity checks on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate manifest.json
        run: python3 -m json.tool extension/manifest.json > /dev/null

      - name: Syntax-check JavaScript
        run: |
          find extension -name "*.js" -print0 | while IFS= read -r -d "" file; do
            echo "node --check $file"
            node --check "$file"
          done

      - name: Build the package
        run: bash scripts/package.sh
