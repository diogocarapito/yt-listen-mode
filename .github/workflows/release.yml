# Push a tag like v1.0.1 and this builds the zip and publishes a GitHub Release.
# The tag must match "version" in extension/manifest.json.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches manifest.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(python3 -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Tag is v$TAG_VERSION but manifest.json says $MANIFEST_VERSION. Bump the manifest first." >&2
            exit 1
          fi

      - name: Build the package
        run: bash scripts/package.sh

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
